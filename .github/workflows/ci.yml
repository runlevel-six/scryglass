name: CI

on:
  push:
    # Both names, deliberately. This repository's default branch is master, and
    # listing only main would mean every push went to a branch this workflow
    # does not watch — CI never running, which is a failure mode with no symptom.
    branches: [main, master]
    # Release tags, or the publish job's semver handling below is unreachable:
    # with only `branches` listed, a tag push does not start this workflow at all.
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd: $unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy'"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

      # The committed example is the thing users copy, so it has to be loadable
      # by the binary that ships. A broken example is a broken first five
      # minutes, and nothing else in this workflow would notice.
      - name: The example catalog must load
        run: |
          go build -o "$RUNNER_TEMP/scryglass" ./cmd/scryglass
          SCRYGLASS_CATALOG=catalog.example.yaml \
          SCRYGLASS_BASE_URL=https://home.example.com \
          SCRYGLASS_ADDR=127.0.0.1:8099 \
            "$RUNNER_TEMP/scryglass" &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8099/healthz >/dev/null
          # And the omnibox must actually route, not merely start.
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            'http://127.0.0.1:8099/search?q=photos')
          kill $pid
          if [ "$location" != "https://photos.example.com/" ]; then
            echo "::error::omnibox routed 'photos' to '$location'"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  image:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: scryglass:ci

      # distroless/static has no shell, so the image cannot be smoke-tested by
      # running a command in it. Running the binary with no configuration is
      # the check that it is a working ELF at all — the failure this catches is
      # a binary that cannot start for lack of a loader, which looks like
      # "no such file or directory" and is nothing of the kind.
      - name: The binary must run in the image
        run: |
          output=$(docker run --rm scryglass:ci 2>&1 || true)
          echo "$output"
          if ! echo "$output" | grep -q "SCRYGLASS_CATALOG is required"; then
            echo "::error::binary did not start; expected a configuration error"
            exit 1
          fi

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    # Only after everything that can say the build is broken has said
    # otherwise. An image that fails its own checks is worse than no image: it
    # looks deployable.
    needs: [test, lint, image]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history, because the version is `git describe` and a
          # shallow clone has neither. Without this an edge build reports a
          # bare commit and a release build cannot confirm it is on the tag it
          # claims to be.
          fetch-depth: 0

      - name: Derive the version
        id: version
        run: |
          version=$(git describe --tags --match 'v[0-9]*' --always)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published release is immutable. Moving one means anybody who already
      # pulled it has different bytes under the same name, and no way to know.
      - name: Refuse to republish an existing release
        if: github.ref_type == 'tag'
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::ghcr.io/${{ github.repository }}:${{ github.ref_name }} already exists." \
                 "Releases are never republished — cut the next patch instead."
            exit 1
          fi
          echo "${{ github.ref_name }} has not been published before."

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          provenance: false

      # The stamp is injected by -ldflags, so nothing else in this workflow
      # would notice if it were lost — the image would build, run and serve,
      # reporting "dev" forever.
      - name: The image must report the tag it was published under
        if: github.ref_type == 'tag'
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          reported=$(docker run --rm "$image" version)
          echo "$reported"
          if ! echo "$reported" | grep -q "${{ github.ref_name }}"; then
            echo "::error::image reports '$reported', expected ${{ github.ref_name }}"
            exit 1
          fi
