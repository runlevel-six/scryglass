{{define "tiles"}}
{{if .Groups}}
<section class="wall" aria-label="Services">
  {{range .Groups}}
  {{if .Name}}<h2 class="group">{{.Name}}</h2>{{end}}
  <ul class="tiles">
    {{range .Tiles}}
    <li class="tile state-{{.State}}" {{if .Title}}title="{{.Title}}"{{end}}>
      <a href="{{.URL}}">
        <span class="dot" aria-hidden="true"></span>
        <span class="name">{{.Name}}</span>
        {{if .Spark}}<span class="spark" aria-hidden="true">{{.Spark}}</span>{{end}}
      </a>
    </li>
    {{end}}
  </ul>
  {{end}}
</section>
{{end}}
{{end}}
