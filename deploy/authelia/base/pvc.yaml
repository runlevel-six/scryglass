apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia
  labels:
    app.kubernetes.io/name: authelia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName is deliberately unset so a cluster with a default class
  # works out of the box. Name it in your overlay — see overlays/example. It
  # must be a block-mode class, not a network filesystem: Authelia keeps its
  # state in SQLite, whose locking is unreliable over NFS-alikes.
