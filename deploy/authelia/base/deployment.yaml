apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  labels:
    app.kubernetes.io/name: authelia
spec:
  replicas: 1
  # The PVC is ReadWriteOnce and SQLite wants one writer, so the old pod must be
  # gone before the new one starts. RollingUpdate would deadlock on the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
    spec:
      # Kubernetes injects legacy service-link env vars for every Service in the
      # namespace — AUTHELIA_SERVICE_PORT, AUTHELIA_PORT_9091_TCP and so on.
      # Authelia reads its own configuration from AUTHELIA_-prefixed env vars,
      # so it parses those as config: they synthesise a deprecated `port` key,
      # which then collides with server.address and kills startup.
      #
      # The collision exists because the Service is named `authelia` in a
      # namespace of the same name. Turning the links off is the fix that keeps
      # the obvious name.
      enableServiceLinks: false
      securityContext:
        # An explicit UID is required, not just runAsNonRoot. The upstream image
        # inherits from authelia/base and declares no USER, so it would run as
        # root; the kubelet then has nothing to verify against runAsNonRoot and
        # refuses to create the container with CreateContainerConfigError.
        #
        # The UID itself is arbitrary — the binary only needs to read its config
        # and write /config — but fsGroup must match, or the PVC lands owned by
        # root and Authelia cannot create its database.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authelia
          image: ghcr.io/authelia/authelia:4.39.20
          args:
            - '--config'
            - '/etc/authelia/config/configuration.yml'
          ports:
            - name: http
              containerPort: 9091
          env:
            # Secrets are supplied as files rather than values so they do not
            # appear in `kubectl describe pod` or in the container's environment.
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: '/secrets/session-secret'
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: '/secrets/storage-encryption-key'
            # Supplied even though password reset is disabled: the identity
            # validation block is validated at startup. If a future release
            # stops requiring it, this can go.
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
              value: '/secrets/jwt-secret'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # Mounted as directories, deliberately. A subPath mount is resolved
            # once at container start and never updated, so `watch: true` on the
            # users file would never fire — adding a user would silently do
            # nothing until the Deployment was rolled. Directory mounts are
            # updated by symlink swap and do propagate.
            - name: config
              mountPath: /etc/authelia/config
              readOnly: true
            - name: users
              mountPath: /etc/authelia/users
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            # State: the SQLite database holding every registered passkey and
            # TOTP secret, plus the notification file.
            - name: data
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: users
          secret:
            secretName: authelia-users
        - name: secrets
          secret:
            secretName: authelia-secrets
        - name: data
          persistentVolumeClaim:
            claimName: authelia
        - name: tmp
          emptyDir: {}
