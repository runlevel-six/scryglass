apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A worked example. Copy it to deploy/scryglass/overlays/local — gitignored —
# then put your real hosts in catalog.yaml and the patches below.

namespace: scryglass

resources:
  - ../../base

# Replaces the base catalog wholesale. Patching a list by index is how an entry
# ends up applying to the wrong thing after somebody inserts a line above it.
configMapGenerator:
  - name: scryglass-catalog
    behavior: replace
    files:
      - catalog.yaml

patches:
  # Naming the class here means a change to the cluster default cannot silently
  # move the bookmarks onto different storage. It must be block mode.
  - target:
      kind: PersistentVolumeClaim
      name: scryglass
    patch: |
      - op: add
        path: /spec/storageClassName
        value: REPLACE-block-storage-class

  - target:
      kind: Ingress
      name: scryglass
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: home.example.com
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1auth-signin
        value: https://auth.example.com?rm=$request_method

  - target:
      kind: Deployment
      name: scryglass
    # A strategic merge patch rather than a JSON patch by index.
    #
    # env merges on the `name` key, so these land on the right variables
    # whatever order the base lists them in and whatever it adds later. The
    # index form is silently wrong the first time a variable is inserted above
    # the one being patched — it overwrites its neighbour, and the symptom is
    # a setting that mysteriously has someone else's value.
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: scryglass
      spec:
        template:
          spec:
            containers:
              - name: scryglass
                env:
                  - name: SCRYGLASS_BASE_URL
                    value: https://home.example.com
                  - name: SCRYGLASS_LOGOUT_URL
                    value: https://auth.example.com/logout

images:
  - name: ghcr.io/runlevel-six/scryglass
    newTag: v0.7.0
