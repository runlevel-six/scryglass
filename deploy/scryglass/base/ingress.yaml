apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scryglass
  labels:
    app.kubernetes.io/name: scryglass
  annotations:
    # Gated. This is the omnibox over your own things: an ungated one hands
    # anybody a search box into your archive and your bookmarks.
    #
    # See deploy/authelia/forward-auth.md for why this is auth-request rather
    # than forward-auth, and why rm= rather than rd=.
    nginx.ingress.kubernetes.io/auth-url: >-
      http://authelia.authelia.svc.cluster.local:9091/api/authz/auth-request
    nginx.ingress.kubernetes.io/auth-signin: >-
      https://auth.example.com?rm=$request_method
    nginx.ingress.kubernetes.io/auth-response-headers: >-
      Remote-User,Remote-Name,Remote-Groups,Remote-Email
spec:
  ingressClassName: nginx
  rules:
    - host: home.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scryglass
                port:
                  name: http
