# Scryglass catalog — a worked example.
#
# Copy this, point SCRYGLASS_CATALOG at your copy, and put your own hosts in
# it. The real one is deployed from a ConfigMap and is not committed here: a
# host list is a map of somebody's network.
#
# In M1 every resource is listed by hand. From M2 the app tiles are discovered
# from Ingress objects instead and this file keeps only what the cluster
# cannot tell us — external bookmarks, and anything not running here.

# Where a query goes when nothing else claims it. Required.
search:
  name: Web
  url: "https://search.example.com/search?q={query}"

# Prefixes that route somewhere specific. Type `!t wal archiving` — or
# `wal archiving !t`, both ends work.
#
# These are plain redirects, deliberately. The target already knows how to
# search itself and already knows who you are, so there is nothing to
# integrate: a bang works the day you add it.
#
# A bang is for something that has its OWN search. Anything you merely want to
# jump to belongs under `resources` below, where typing its name — or a unique
# prefix — already gets you there. A bang pointed at an application with no
# search endpoint produces a URL that application does not understand, which
# fails as a page that looks broken rather than as a configuration error.
bangs:
  - key: t
    name: Archive
    url: "https://archive.example.com/search?q={query}"

# Things to jump to. Typing a name — or a unique prefix of one — goes straight
# there instead of searching.
#
# An entry here CORRECTS a discovered one rather than replacing it. Match on
# url and set only what you want to change — a better name than the Ingress
# object's, some aliases, a group. Everything you leave out, including the
# health check, is filled in from what was discovered.
#
# To deliberately not probe something that was discovered, set `check: off`.
#
# `check` takes a full URL, which is how you override a bad guess. Discovery
# infers the scheme from the backend port number, and where that inference is
# wrong there is no smarter guess available — a server that also speaks TLS on
# its plaintext port just closes the connection, which is indistinguishable
# from being down. Set the URL you actually want probed.
#
# Ambiguity is not resolved by guessing: if two resources match equally well
# the query falls through to search, because a confident jump to the wrong
# application looks deliberate.
resources:
  - name: Photos
    url: https://photos.example.com
    group: media
    aliases: [gallery, pics]

  - name: Media
    url: https://media.example.com
    group: media

  - name: Notes
    url: https://notes.example.com
    group: personal
