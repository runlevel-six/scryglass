apiVersion: apps/v1
kind: Deployment
metadata:
  name: scryglass
  labels:
    app.kubernetes.io/name: scryglass
spec:
  replicas: 1
  # The PVC is ReadWriteOnce and SQLite wants one writer, so the old pod must
  # be gone before the new one starts. RollingUpdate would deadlock on the
  # volume: the new pod cannot mount it until the old one releases it, and the
  # old one is not terminated until the new one is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scryglass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scryglass
    spec:
      # Kubernetes injects SCRYGLASS_SERVICE_HOST, SCRYGLASS_PORT and friends
      # for every Service in the namespace, and this binary reads its
      # configuration from SCRYGLASS_-prefixed variables. Nothing collides
      # today — it reads ADDR, CATALOG, BASE_URL and TITLE, none of which
      # Kubernetes generates — but adding a setting called PORT would be a
      # very confusing afternoon. Turning the links off costs nothing.
      enableServiceLinks: false
      serviceAccountName: scryglass
      securityContext:
        # An explicit UID, not just runAsNonRoot: the kubelet has to be able to
        # verify the user is non-root before it will start the container, and
        # cannot do that from the image alone.
        runAsNonRoot: true
        runAsUser: 65532   # distroless "nonroot"
        runAsGroup: 65532
        # Required now that there is a volume: without it the PVC lands owned
        # by root and the process cannot create its database. Learned on this
        # cluster's Authelia deployment rather than from a document.
        fsGroup: 65532
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scryglass
          image: ghcr.io/runlevel-six/scryglass:v0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SCRYGLASS_ADDR
              value: ':8080'
            - name: SCRYGLASS_CATALOG
              value: /etc/scryglass/catalog.yaml
            # No default: the process cannot discover what it is reachable as,
            # and the OpenSearch descriptor has to name an absolute URL.
            - name: SCRYGLASS_BASE_URL
              value: REPLACE-https://home.example.com

            # Reads Ingress objects to build the tile wall. Off by default in
            # the binary so it runs anywhere; on here, because in a cluster the
            # cluster is the better source than a hand-kept list. That
            # staleness is what killed the dashboard this replaces.
            - name: SCRYGLASS_DISCOVERY
              value: 'true'

            # The annotation namespace read for per-Ingress overrides — name,
            # group, icon, probe path, retired, hide. Change it and change the
            # annotations on your Ingresses to match.
            - name: SCRYGLASS_ANNOTATION_PREFIX
              value: scryglass.local

            # How far back a tile's status bar reaches. It fills at one segment
            # per bucket and reads grey until it does, so a longer window means
            # a wall that looks broken for longer after every deploy.
            - name: SCRYGLASS_BAR_WINDOW
              value: 30m

            # Where bookmarks live. Unset disables them entirely, which is a
            # supported way to run this rather than a degraded one — it is what
            # every milestone before this one did.
            - name: SCRYGLASS_DATABASE
              value: /var/lib/scryglass/bookmarks.db

            # Your identity provider's sign-out address. No default: it is
            # provider-specific, and a wrong guess is a button that looks like
            # it works and does nothing. Unset hides the control.
            - name: SCRYGLASS_LOGOUT_URL
              value: REPLACE-https://auth.example.com/logout
          securityContext:
            allowPrivilegeEscalation: false
            # Still safe: everything this writes goes to the mounted volume
            # below, and nothing is written to the image's own filesystem.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # A directory, not a subPath. A subPath mount is resolved once at
            # container start and never updated — which matters the moment
            # anything here starts re-reading its configuration.
            - name: catalog
              mountPath: /etc/scryglass
              readOnly: true
            - name: data
              mountPath: /var/lib/scryglass
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
      volumes:
        - name: catalog
          configMap:
            name: scryglass-catalog
        - name: data
          persistentVolumeClaim:
            claimName: scryglass
